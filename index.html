شد المعرفي"',label:"ثانياً",icon:"\uD83D\uDCA1",text:"لم يعد الاسم التقليدي أمين المكتبة معبراً عن حجم المسؤولية وتنوع المهام التي يضطلع بها القائم على هذا المنصب. فهو لم يعد مجرد من يُعير الكتب ويردها أو يرتبها على الأرفف، بل هو معلم وموجه وخبير في مصادر المعلومات والبحث. لذا يُقترح تعديل المسمى ليصبح المرشد المعرفي أو أخصائي المصادر والمعلومات، ليعكس حقيقة الدور الجديد: فهو من يرشد الطالب إلى طريق المعرفة، ويعلمهم كيف يبحثون، وكيف يميزون ما هو صحيح وما هو زائف، وكيف يستخدمون ما يتاح لهم من تقنيات لخدمة تعلمهم لا ليحل محلها."},{id:3,title:"تطوير اسم المكتبة",label:"ثالثاً",icon:"\uD83C\uDFDB️",text:"كذلك فإن كلمة مكتبة باتت لا تستوعب كل ما تضمه القاعة من مصادر رقمية وأجهزة حاسوب واتصال بشبكات المعرفة العالمية، ومساحات للقراءة والبحث والنقاش. ومن المقترح أن يُستبدل بها مسمى أكثر اتساعاً وشمولية، مثل مركز المعرفة والتعلم أو مركز المصادر والمعلومات، ليعكس التحول من مجرد حفظ الكتب إلى إدارة تدفق المعرفة بكل أشكالها."},{id:4,title:"التطور ممكن دون عبء مالي",label:"رابعاً",icon:"\uD83D\uDEE0️",text:"ومن الأهمية بمكان التأكيد على أن هذا التطوير والتحول لا يتطلب بالضرورة ميزانيات ضخمة أو تجهيزات باهظة الثمن، وهو ما يتناسب مع الظروف الراهنة وتحديات الموارد المتاحة. فالتحول الحقيقي لا يكمن في شراء أجهزة عصرية أو إنشاء مبنى جديد بقدر ما يكمن في تطوير قدرات ومهارات الأخصائي القائم على العملية. فالمكتبة الموجودة بالفعل، بما تملكه من كتب ومساحات، يمكن أن تتحول إلى مركز معرفي متجدد إذا امتلك القائم عليها الوعي والمهارة اللازمة. تحديث الأسلوب وتنويع المصادر المتاحة وتوظيف ما هو موجود من أجهزة وإنترنت وتقديم ورش العمل والأنشطة بالطريقة المثلى، كل ذلك لا يتطلب تكاليف إضافية تذكر بل يتطلب فقط إعداد الأخصائي وتنمية معارفه وقدراته ليكون قادراً على قيادة هذا التحول. فالاستثمار الحقيقي والأجدى هو في الإنسان، في تأهيله وتدريبه وتمكينه، لأنه من يستطيع أن يُخرج من الإمكانات المتاحة أقصى ما يمكن، وهو من يجعل للمكان قيمته الحقيقية."},{id:5,title:"مواكبة لتوجيهات القيادة وتطوير التعليم",label:"خامساً",icon:"\uD83C\uDFAF",text:"يأتي هذا التطوير انسجاماً مع التوجيهات الحكيمة للقيادة السياسية المصرية التي تضع تطوير التعليم على رأس أولوياتها وتؤكد على بناء الإنسان المصري وتأهيله لمتطلبات العصر. كما يأتي مواكباً لجهود وزارة التربية والتعليم والتعليم الفني في تطوير العملية التعليمية والتحول من الحفظ والتلقين إلى الفهم والبحث والابتكار، وإعداد جيل قادر على المنافسة محلياً وعالمياً. إن تطوير دور المكتبة وأخصائييها يعد ركيزة أساسية تُساهم في تحقيق هذه الرؤية، فهو يُترجم التوجيهات العليا إلى واقع عملي ملموس داخل كل مدرسة، ويجعل من المكتبة أداة فاعلة في تحقيق أهداف الدولة في التطوير التربوي والمعرفي."},{id:6,title:"تعظيم الدور في ظل التطورات الحديثة",label:"سادساً",icon:"\uD83E\uDD16",text:"مع التوسع الهائل في المحتوى الرقمي وانتشار أدوات الذكاء الاصطناعي، ازدادت الحاجة إلى المكتبة المدرسية ولم تقل. فالمعلومات لم تعد نادرة، بل أصبحت متوفرة بكميات هائلة، ولم تعد المشكلة في كيف أحصل على المعلومة بل في أي معلومة هي الصادقة والموثوقة، وكيف أستخدم هذه الأدوات ولا أستخدم من قبلها. هنا يبرز دور المكتبة والمرشد المعرفي بوصفهما الضمانة الأساسية لتحصين الطالب ضد التضليل وتعليمهم كيفية التعامل مع التقنيات الحديثة بوعي ومسؤولية. فالمكتبة هي المكان الذي يُقابل فيه الإبداع الإنساني بالتقنيات الحديثة، فلا يُلغي أحدهما الآخر بل يُثري كل منهما الآخر."}];function bf(){return z("div",{dir:"rtl",className:"min-h-screen bg-[#F8F6F1] text-[#1A1A1A] antialiased selection:bg-[#C9A86A]/30",children:[d("style",{children:`
